# =============================================================================
# PRODUCTION SUPERVISORD CONFIGURATION
# Combined: Queue Worker + Scheduler for Laravel Filament
# Logging: stdout/stderr (Docker-friendly)
# =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

# =============================================================================
# QUEUE WORKER - Laravel Queue (Redis Driver)
# =============================================================================
[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60 --verbose
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=60
startsecs=5
startretries=3

# =============================================================================
# SCHEDULER - Laravel Task Scheduler (Every Minute)
# =============================================================================
[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while true; do /usr/local/bin/php /var/www/html/artisan schedule:run --verbose --no-interaction && sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
