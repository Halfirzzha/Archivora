; =============================================================================
; PHP-FPM PRODUCTION CONFIGURATION
; Optimized for Laravel Filament with connection pooling & stability
; =============================================================================

[www]
; Unix socket or TCP (using TCP for Nginx upstream)
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000
pm.process_idle_timeout = 10s

; Status & Ping (for health checks)
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Logging
access.log = /dev/stdout
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Security (ensure no PHP injection via env vars)
clear_env = no

; Request timeout
request_terminate_timeout = 60s
request_slowlog_timeout = 30s
slowlog = /dev/stderr
