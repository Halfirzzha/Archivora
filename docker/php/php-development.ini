; =============================================================================
; DEVELOPMENT PHP CONFIGURATION - PHP 8.5
; Optimized for Laravel Filament with debugging enabled
; =============================================================================

[PHP]
; Performance & Memory
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 100M
upload_max_filesize = 100M

; Development - Show ALL errors
expose_php = On
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Session (will use Redis in production via Laravel config)
session.cookie_httponly = On
session.cookie_secure = Off
session.use_strict_mode = On
session.cookie_samesite = "Lax"

; Variables order (required for Laravel)
variables_order = EGPCS

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Date/Time
date.timezone = Asia/Jakarta

; =============================================================================
; OPCACHE CONFIGURATION - Development Mode
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT Disabled for development (better debugging)
opcache.jit_buffer_size = 0
opcache.jit = off

; Optimization
opcache.optimization_level = 0x7FFFFFFF

; =============================================================================
; REALPATH CACHE - Reduce filesystem calls
; =============================================================================
realpath_cache_size = 4096K
realpath_cache_ttl = 60

; =============================================================================
; SECURITY - Development Mode (Allow debugging functions)
; =============================================================================
disable_functions = 
allow_url_fopen = On
allow_url_include = Off
