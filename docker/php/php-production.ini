; =============================================================================
; PRODUCTION PHP CONFIGURATION - PHP 8.5
; Optimized for Laravel Filament with OPcache + JIT + Security hardening
; =============================================================================

[PHP]
; Performance & Memory
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 100M
upload_max_filesize = 100M

; Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Session (will use Redis in production via Laravel config)
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On
session.cookie_samesite = "Lax"

; Variables order (required for Laravel)
variables_order = EGPCS

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Date/Time
date.timezone = Asia/Jakarta

; =============================================================================
; OPCACHE CONFIGURATION - Maximum Performance
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.revalidate_freq = 0

; JIT (Just-In-Time Compilation) - PHP 8.5 Performance Boost
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; Optimization
opcache.optimization_level = 0x7FFFFFFF
opcache.huge_code_pages = 1

; =============================================================================
; REALPATH CACHE - Reduce filesystem calls
; =============================================================================
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; =============================================================================
; SECURITY HARDENING
; =============================================================================
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
allow_url_fopen = On
allow_url_include = Off
